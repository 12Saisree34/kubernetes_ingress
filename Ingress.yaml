apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: 
  name: my-ingress
  namespace: prod
spec:
  rules:
    - http:
        paths:
          - path: /beauty
            pathType: prefix
            backend:
              service:
                name: beauty-ingress
                
    - http:
        paths:
          - path: /highway
            pathType: prefix
            backend:
              service:
                name: highway-ingress
                

